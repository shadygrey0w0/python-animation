<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Python Algorithm Visualizer</title>

    <link
        rel="stylesheet"
        href="https://pyscript.net/releases/2026.7.3/core.css"
    >

    <script
        type="module"
        src="https://pyscript.net/releases/2026.7.3/core.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #array {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 30px;
        }

        .box {
            width: 55px;
            height: 55px;
            border: 2px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        #status {
            font-size: 20px;
            margin: 20px;
        }

        #code {
            width: 700px;
            margin: 30px auto;
            padding: 20px;
            background: #f4f4f4;
            text-align: left;
            white-space: pre;
            font-family: monospace;
        }
    </style>
</head>

<body>

    <h1>Python Algorithm Visualizer</h1>

    <button id="linear-button">
        Linear Search
    </button>

    <button id="binary-button">
        Binary Search
    </button>

    <div id="array"></div>

    <p>
        Target:
        <strong id="target">42</strong>
    </p>

    <button id="start-button">
        Start Animation
    </button>

    <div id="status">
        Select an algorithm.
    </div>

    <div id="code"></div>

    <script
        type="py"
        src="./main.py">
    </script>

</body>

</html>
